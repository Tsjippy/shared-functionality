<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Smooth blue → teal gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2f7fd3"/>
      <stop offset="100%" stop-color="#3fd0b6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="32" fill="url(#bg)"/>

  <!-- Subtle shield -->
  <path d="M128 12 L44 128 L128 244 L212 128 Z"
        fill="white"
        opacity="0.06"/>

  <!-- Sailing wave contour -->
  <path d="M0 170 
           Q32 150 64 170 
           T128 170 
           T192 170 
           T256 170"
        stroke="white"
        stroke-width="3"
        stroke-opacity="0.18"
        fill="none"/>

  <!-- Sail (minimal triangle) -->
  <path d="M150 72 L192 182 L120 182 Z"
        fill="white"
        opacity="0.12"/>

</svg>
