name: Re-usable Release Flow
on:
  workflow_call:

jobs:
  job1:
    name: Update wp plugin version
    runs-on: ubuntu-latest
    environment: production
    steps:
        - uses: actions/checkout@v7

        - uses: actions/setup-node@v6

        - name: Install dependencies
          run: sudo pip3 install PyGithub

        - name: Get the python File
          uses: actions/checkout@v7
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          with:
            repository: tsjippy/shared-functionality
            path: scripts
            sparse-checkout: |
              .github/workflows/update_version.py
            sparse-checkout-cone-mode: false

        - name: Get the shared code
          uses: actions/checkout@v7
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          with:
            repository: tsjippy/shared-functionality
            path: shared-functionality
            sparse-checkout: |
              activation-pro.php
              constants.php
              error_handler.php
              index.php
              loader.php
              css
              modules
              js
              php
              blocks
              pictures
            sparse-checkout-cone-mode: false

        - name: Update version
          env: 
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            RELEASE_TAG: ${{ github.event.release.name }}
            PLUGIN: ${{ github.event.repository.name }}
          run: python scripts/.github/workflows/update_version.py

        - name: Set Prefix
          id: prefix
          run: |
            if [[ ${{ github.event.repository.name }} =~ "tsjippy-" ]]; then
              echo "prefix=" >> "$GITHUB_OUTPUT"
            else
              echo "prefix=tsjippy-" >> "$GITHUB_OUTPUT"
            fi

        - name: Commit version update
          uses: test-room-7/action-update-file@v2
          env: 
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          with:
              allow-removing: true
              file-path: |
                CHANGELOG.md
                {${{ steps.prefix.outputs.prefix }}${{ github.event.repository.name }}.php,style.css}
              commit-msg: Update wp plugin version
              github-token: ${{ secrets.GITHUB_TOKEN }}

        - name: Release ZIP
          run: zip -r ${{ steps.prefix.outputs.prefix }}${{ github.event.repository.name }}.zip .    -x *.json *.xml *.lock *.py *.db *.md *.code-workspace *.cmd "*.vscode/*" .gitignore .gitattributes *.zip "*.git/*" "*.github/*" "*scripts/*"

        - name: WP Release ZIP
          run: zip -r WP-${{ steps.prefix.outputs.prefix }}${{ github.event.repository.name }}.zip . -x *.json *.xml *.lock *.py *.db *.md *.code-workspace *.cmd "*.vscode/*" .gitignore .gitattributes *.zip "*.git/*" "*.github/*" "*scripts/*" "*/github/*" "*other/*" pro-*.php *debug.php *dev.php

        - name: Release
          uses: softprops/action-gh-release@v3
          if: startsWith(github.ref, 'refs/tags/')
          with:
            files: | 
              ${{ steps.prefix.outputs.prefix }}${{ github.event.repository.name }}.zip
              WP-${{ steps.prefix.outputs.prefix }}${{ github.event.repository.name }}.zip
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        - name: Get the .distignore File
          if: ${{ env.SVN_USERNAME != '' }}
          uses: actions/checkout@v6
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          with:
            repository: tsjippy/shared-functionality
            sparse-checkout: |
              .github/workflows/.distignore
            sparse-checkout-cone-mode: false

        
        # This step is needed because expo-github-action does not support paths.
        # Therefore all mobile app assets should be moved to the project root.
        - name: Move .distignore file to root
          if: ${{ env.SVN_USERNAME != '' }}
          env:
            SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          run: |
            ls -lah
            shopt -s dotglob
            mv .github/workflows/.distignore .
            rm -rf .github
            ls -lah

        - name: WordPress Plugin Deploy
          if: ${{ env.SVN_USERNAME != '' }}
          uses: 10up/action-wordpress-plugin-deploy@stable
          env:
            SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
            SVN_USERNAME: ${{ secrets.SVN_USERNAME }}