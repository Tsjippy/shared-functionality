name: Re-usable Release Flow
on:
  workflow_call:

jobs:
  job1:
    name: Update wp plugin version
    runs-on: ubuntu-latest
    environment: production
    steps:
        - uses: actions/checkout@v7

        - uses: actions/setup-node@v6

        - name: Install dependencies
          run: sudo pip3 install PyGithub

        - name: Get the python File
          uses: actions/checkout@v7
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          with:
            repository: tsjippy/shared-functionality
            path: scripts
            sparse-checkout: |
              .github/workflows/update_version.py
            sparse-checkout-cone-mode: false

        - name: Set Prefix
          id: prefix
          run: |
            if [[ ${{ github.event.repository.name }} =~ "tsjippy-" ]]; then
              echo "prefix=" >> "$GITHUB_OUTPUT"
            else
              echo "prefix=tsjippy-" >> "$GITHUB_OUTPUT"
            fi

        - name: Get the shared code
          uses: actions/checkout@v7
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          with:
            repository: tsjippy/shared-functionality
            path: ${{ steps.prefix.outputs.prefix }}${{ github.event.repository.name }}/shared-functionality
            sparse-checkout: |
              activation-pro.php
              constants.php
              error_handler.php
              index.php
              loader.php
              css
              modules
              js
              php
              blocks
              pictures
            sparse-checkout-cone-mode: false

        - name: Update version
          env: 
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            RELEASE_TAG: ${{ github.event.release.name }}
            PLUGIN: ${{ github.event.repository.name }}
          run: python scripts/.github/workflows/update_version.py

        - name: Commit version update
          uses: test-room-7/action-update-file@v2
          env: 
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          with:
              allow-removing: true
              file-path: |
                CHANGELOG.md
                {${{ steps.prefix.outputs.prefix }}${{ github.event.repository.name }}.php,style.css}
              commit-msg: Update wp plugin version
              github-token: ${{ secrets.GITHUB_TOKEN }}

        - name: Release ZIP
          run: |
            PLUGIN=${{ steps.prefix.outputs.prefix }}${{ github.event.repository.name }}

            rsync -av \
              --exclude="$PLUGIN/" \
              --exclude='*.xml' \
              --exclude='*.lock' \
              --exclude='*.py' \
              --exclude='*.db' \
              --exclude='*.md' \
              --exclude='*.code-workspace' \
              --exclude='*.cmd' \
              --exclude='.vscode/' \
              --exclude='.gitignore' \
              --exclude='.gitattributes' \
              --exclude='*.zip' \
              --exclude='.git/' \
              --exclude='.github/' \
              --exclude='scripts/' \
              ./ ./$PLUGIN

            zip -r "$PLUGIN.zip" "$PLUGIN"

        - name: WP Release ZIP
          run: |
            PLUGIN=${{ steps.prefix.outputs.prefix }}${{ github.event.repository.name }}

            zip -r "WP-$PLUGIN.zip" "$PLUGIN" \
              -x "*/github/*" "*other/*" "*/pro-*.php" "*debug.php" "*dev.php"

        - name: Release
          uses: softprops/action-gh-release@v3
          if: startsWith(github.ref, 'refs/tags/')
          with:
            files: | 
              ${{ steps.prefix.outputs.prefix }}${{ github.event.repository.name }}.zip
              WP-${{ steps.prefix.outputs.prefix }}${{ github.event.repository.name }}.zip
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}